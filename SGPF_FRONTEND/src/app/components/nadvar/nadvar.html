<aside class="sidebar bg-sidebar d-none d-lg-flex">
  <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
  <ng-container *ngTemplateOutlet="sidebarFooter"></ng-container>
</aside>

<div
  #offcanvasSidebar
  class="offcanvas offcanvas-start d-lg-none"
  tabindex="-1"
  id="mobileSidebar"
  aria-labelledby="mobileSidebarLabel"
  data-bs-scroll="true"
>
  <div class="offcanvas-header bg-sidebar border-custom">
    <div class="d-flex align-items-center gap-2">
      <div class="brand-icon-sm">
        <i class="bi bi-shield-fill"></i>
      </div>
      <span id="mobileSidebarLabel" class="offcanvas-title text-gold fw-bold">SGPF Orense SC</span>
    </div>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body bg-sidebar p-0 d-flex flex-column">
    <ng-container *ngTemplateOutlet="sidebarContent"></ng-container>
    <ng-container *ngTemplateOutlet="sidebarFooter"></ng-container>
  </div>
</div>

<div class="mobile-topbar d-lg-none">
  <button class="btn btn-link text-gold p-0" (click)="openMobile()" aria-label="Abrir menú">
    <i class="bi bi-list fs-3"></i>
  </button>
  <span class="text-gold fw-bold">SGPF Orense SC</span>
</div>

<ng-template #sidebarContent>
  <div class="sidebar-brand">
    <div class="brand-icon">
      <i class="bi bi-shield-fill"></i>
    </div>
    <div class="brand-text">
      <span class="brand-title">SGPF Orense</span>
      <span class="brand-subtitle">Gestión Deportiva</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of filteredNavItems"
      [routerLink]="[item.path]"
      routerLinkActive="active"
      class="nav-link"
      (click)="closeMobile()"
    >
      <i class="bi me-2" [class]="item.icon"></i>
      <span>{{ item.label }}</span>
    </a>
  </nav>
</ng-template>

<ng-template #sidebarFooter>
  <div class="sidebar-footer">
    <div class="text-center text-white-50 small mb-2">{{ usuarioActual?.nombre_usuario }} - {{ rolVisible }}</div>
    <button class="btn-logout" (click)="logout()">
      <i class="bi bi-box-arrow-right me-2"></i>
      Cerrar Sesión
    </button>
  </div>
</ng-template>
