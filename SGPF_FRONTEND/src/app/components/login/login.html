<div class="login-wrapper">
  <div class="login-card bg-card">
    <div class="login-header">
      <div class="logo-circle">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2>SGPF Orense SC</h2>
      <p class="text-muted-custom">Sistema de Gestión Deportiva</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="mb-3">
        <label for="username" class="form-label">
          <i class="bi bi-person-fill me-1"></i>Usuario
        </label>
        <input
          type="text"
          id="username"
          class="form-control bg-dark text-light border-custom"
          [(ngModel)]="username"
          name="username"
          placeholder="Ingrese su usuario"
          autocomplete="username"
          required
        />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">
          <i class="bi bi-lock-fill me-1"></i>Contraseña
        </label>
        <div>
          <input
            type="password"
            id="password"
            class="form-control bg-dark text-light border-custom"
            [(ngModel)]="password"
            name="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger py-2 fade-in">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error }}
      </div>

      <button
        type="submit"
        class="btn btn-gold w-100"
        [disabled]="loading"
      >
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading ? 'Verificando...' : 'Iniciar Sesión' }}
      </button>
    </form>


  </div>
</div>
