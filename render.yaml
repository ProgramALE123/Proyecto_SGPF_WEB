services:
  - type: web
    name: sgpf-web
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build && npm run db:install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: DB_HOST
        fromDatabase:
          name: sgpf-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sgpf-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: sgpf-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sgpf-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sgpf-db
          property: password

databases:
  - name: sgpf-db
    databaseName: sgpf
    plan: free
